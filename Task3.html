<!DOCTYPE html>
<html>
    <header>
        <title>dynamic form</title>
        <script src="script.js"></script>
    </header>
    <body>
        <h1>Dynamic form</h1>
        <form id="user">
            <label>first name</label><br>
            <input type="text" id="name"><br>
            <label>Phone Number</label><br>
            <input type="number" id="phoneNumber"><br>
            <label>Your age</label><br>
            <input type="date" value="2026-11-10" id="date"><br>
            <label>Select File</label><br>
            <input type="file" name="myfile" id="file"><br>
            <label>Video</label><br>
            <input type="file" name="Video" id="myVideo"><br>
            <label>Audio</label><br>
            <input type="file" name="Audio" id="myAudio"><br>
            <button type="submit">Submit</button>
        </form>
        <p id="message"></p>
    </body>
</html>
